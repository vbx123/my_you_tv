name: Build APKs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir out
          cp tv/build/outputs/apk/debug/*.apk out/YouTube-Screen.apk
          cp phone/build/outputs/apk/debug/*.apk out/YouTube-Remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" out/*.apk --title "Build ${{ github.run_number }}" --notes "APKs"
