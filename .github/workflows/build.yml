
name: Build YTRemote APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle
        run: gradle --version

      - name: Build APKs
        run: gradle assembleDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: YTRemote-APKs
          path: |
            app-tv/build/outputs/apk/debug/*.apk
            app-ph/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
